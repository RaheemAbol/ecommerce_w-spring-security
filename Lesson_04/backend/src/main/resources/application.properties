spring.application.name=ecommerce
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=rootPassword1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.com.example.ecommerce=INFO

# Inactivity timeout, not a maximum time since login.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Local HTTP demonstration only. Use secure=true with HTTPS in deployment.
server.servlet.session.cookie.secure=false

# Optional: uncomment to write to a file as well as the console.
# logging.file.name=logs/ecommerce.log
